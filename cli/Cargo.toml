[package]
name = "mojay-cli"
version = "0.1.0"
edition = "2024"
description = "Command-line tool to inspect and manipulate a Mojay data folder"

[[bin]]
name = "mojay"
path = "src/main.rs"
# Same name as the library: only the library is documented.
doc = false

[dependencies]
clap = { version = "4.6.9", features = ["derive", "env"] }
mojay = { path = ".." }

[dev-dependencies]
tempfile = "3.27.0"
