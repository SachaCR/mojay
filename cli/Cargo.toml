[package]
name = "mojay-cli"
version = "0.1.0"
edition = "2024"
description = "Outil en ligne de commande pour inspecter et manipuler un dossier de données Mojay"

[[bin]]
name = "mojay"
path = "src/main.rs"
# Même nom que la bibliothèque : seule elle est documentée.
doc = false

[dependencies]
clap = { version = "4.6.9", features = ["derive", "env"] }
mojay = { path = ".." }

[dev-dependencies]
tempfile = "3.27.0"
