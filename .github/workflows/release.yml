name: Release

# Releases a new version from a button: Actions → Release → Run workflow, from
# `main` (see RELEASING.md). In order:
#
# 1. prepare: computes the version (patch, minor or major bump) and writes it
#    everywhere, and turns the "Unreleased" section of CHANGELOG.md into the
#    section of that version. Nothing is committed yet: the change travels to
#    the next jobs as a patch.
# 2. checks and node-binaries: test the release on Linux and macOS, check the
#    crates package, and build and test the four Node.js binaries.
# 3. tag: only once everything passed, commits "Release <version>" on `main`,
#    tags it `v<version>` and pushes both.
# 4. crates, npm, github-release: publish the tagged code. npm uses trusted
#    publishing (no token): its trusted publisher is this file, `release.yml`.
#
# With "dry run", every step runs but nothing is pushed or published.
#
# The release type "none" releases the version already written on `main`: it
# finishes a run that pushed its tag but failed to publish. Each publish step
# skips what is already published, so re-running is always safe.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump (none: release the version already on main)"
        type: choice
        options: [patch, minor, major, none]
        default: patch
      dry_run:
        description: "Dry run: build, test and check everything, push and publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time; never cancel one halfway through its publishes.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  prepare:
    name: Prepare the version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags, to check the new one does not exist yet.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: version
        name: Write the version and the changelog
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          version=$(.github/scripts/prepare-release.sh "$RELEASE_TYPE" "$(date -u +%F)" | tail -n 1)
          tag="v$version"
          echo "Release $version ($RELEASE_TYPE)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Crates, npm package and changelog agree
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          lib=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mojay") | .version')
          cli=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mojay-cli") | .version')
          npm=$(jq -r .version bindings/node/package.json)
          echo "release $VERSION: mojay $lib, mojay-cli $cli, npm $npm"
          if [ "$lib" != "$VERSION" ] || [ "$cli" != "$VERSION" ] || [ "$npm" != "$VERSION" ]; then
            echo "::error::The versions of the crates and the npm package differ"
            exit 1
          fi
          grep -q "^## \[$VERSION\] - " CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
      - name: The tag is new, or already on this commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            exit 0
          fi
          # Only "none" can meet an existing tag: a bump always makes a new
          # version. The run then finishes the release of that tag, which must
          # be the code tested here.
          if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::$TAG already exists on another commit: release a new version instead"
            exit 1
          fi
          echo "$TAG is already on this commit: finishing its release."
      - name: Save the changes as a patch
        run: |
          git diff --binary > release.patch
          git diff --stat
      - uses: actions/upload-artifact@v7
        with:
          name: release-patch
          path: release.patch
          # An empty patch ("none") is still a patch.
          if-no-files-found: error

  checks:
    name: Tests (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-patch
      - name: Apply the release
        run: if [ -s release.patch ]; then git apply --index release.patch; fi && rm release.patch
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Check the crates package
        if: runner.os == 'Linux'
        # --allow-dirty: the release is not committed yet.
        run: cargo publish --dry-run --allow-dirty -p mojay -p mojay-cli

  node-binaries:
    name: Node.js binary (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            test: true
          # Cross-compiled on the arm64 runner: built, not tested.
          - os: macos-latest
            target: x86_64-apple-darwin
            test: false
          # The oldest supported Ubuntu sets the minimum glibc (2.35).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            test: true
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            test: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-patch
      - name: Apply the release
        working-directory: .
        run: if [ -s release.patch ]; then git apply --index release.patch; fi && rm release.patch
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - run: npm ci
      - name: Build
        run: npx napi build --platform --release --target ${{ matrix.target }}
      - name: The loader and the types match the committed ones
        # `napi build` regenerates them: a difference means the committed files
        # (or the version written by prepare-release.sh) are stale.
        run: git diff --exit-code -- index.js index.d.ts
      - name: Test
        if: matrix.test
        run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: bindings/node/mojay.*.node
          if-no-files-found: error

  tag:
    name: Commit and tag
    needs: [prepare, checks, node-binaries]
    runs-on: ubuntu-latest
    permissions:
      # Push the release commit and its tag.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-patch
          path: ${{ runner.temp }}
      - name: Commit, tag and push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PATCH: ${{ runner.temp }}/release.patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -s "$PATCH" ]; then
            git apply "$PATCH"
            git commit -am "Release $VERSION"
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists on this commit (checked by prepare)."
          else
            # Annotated: it records who released, and when.
            git tag -a "$TAG" -m "Mojay $VERSION"
          fi
          git log --oneline -1 --decorate
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: main and $TAG are not pushed."
            exit 0
          fi
          # Fails if main moved since the run started: the release would not
          # contain what was tested. Run it again from the new main.
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/$TAG"

  crates:
    name: Publish to crates.io
    needs: [prepare, tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # In a dry run, the tag exists only in the tag job: test the same
          # code by applying the release again.
          ref: ${{ inputs.dry_run && github.sha || needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v8
        if: inputs.dry_run
        with:
          name: release-patch
      - name: Apply the release
        if: inputs.dry_run
        run: if [ -s release.patch ]; then git apply --index release.patch; fi && rm release.patch
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish mojay and mojay-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            cargo publish --dry-run --allow-dirty -p mojay -p mojay-cli
            exit 0
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" -A "mojay-release" "https://crates.io/api/v1/crates/mojay/$VERSION")
          if [ "$status" = "200" ]; then
            echo "mojay $VERSION is already on crates.io: skipping."
          else
            cargo publish -p mojay -p mojay-cli
          fi

  npm:
    name: Publish to npm
    needs: [prepare, node-binaries, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm accepts this run's OIDC identity instead of a
      # token (package settings → Trusted Publisher on npmjs.com), and links
      # the published version to it (provenance).
      id-token: write
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.dry_run && github.sha || needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v8
        if: inputs.dry_run
        with:
          name: release-patch
      - name: Apply the release
        if: inputs.dry_run
        working-directory: .
        run: if [ -s release.patch ]; then git apply --index release.patch; fi && rm release.patch
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: bindings/node
          merge-multiple: true
      - name: Check the package
        run: |
          cp ../../LICENSE-MIT ../../LICENSE-APACHE .
          ls -l mojay.*.node
          count=$(ls mojay.*.node | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "::error::Expected 4 binaries, found $count"
            exit 1
          fi
          npm pack --dry-run
      - name: npm supports trusted publishing
        run: |
          # Trusted publishing needs npm 11.5.1 or later.
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))
            if (!ok) { console.error(`::error::npm ${process.argv[1]} is older than 11.5.1`); process.exit(1) }
          ' "$(npm --version)"
      - name: Publish
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          name=$(jq -r .name package.json)
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run --access public
          elif npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION is already on npm: skipping."
          else
            npm publish --provenance --access public
          fi

  github-release:
    name: GitHub release
    needs: [prepare, crates, npm]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Create the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # The section of this version: from its heading to the next one.
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: skipping."
          else
            gh release create "$TAG" --title "Mojay $VERSION" --notes-file notes.md --verify-tag
          fi
