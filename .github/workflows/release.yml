name: Release

# Publishes a version (see RELEASING.md).
#
# - Pushing a tag `v<version>` publishes the crates `mojay` and `mojay-cli` to
#   crates.io, the `@mojay-dev/node` npm package with prebuilt binaries for
#   every supported platform, and creates the GitHub release from
#   CHANGELOG.md.
# - Running it by hand (Actions → Release → Run workflow) does, by `mode`:
#   - `rehearsal` (default): every check and build, with dry runs of both
#     publishes. Nothing is published.
#   - `crates` or `npm`: publishes only that registry, for the tag selected in
#     "Use workflow from" (for example the npm package of a version whose
#     crates are already out).
#
# The npm package is published only if its four binaries build and pass their
# tests. Each publish step skips a version that is already published, so a
# failed run can be re-run safely.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: "rehearsal: dry runs only. crates / npm: publish that registry for the selected tag."
        type: choice
        options: [rehearsal, crates, npm]
        default: rehearsal

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # `tag` for a tag push, otherwise the mode chosen by hand.
  MODE: ${{ github.event_name == 'push' && 'tag' || inputs.mode }}

jobs:
  check-version:
    name: Check versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      crates: ${{ steps.plan.outputs.crates }}
      npm: ${{ steps.plan.outputs.npm }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Tag, crates and npm package must agree
        run: |
          lib=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mojay") | .version')
          cli=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mojay-cli") | .version')
          npm=$(jq -r .version bindings/node/package.json)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ "$MODE" = "rehearsal" ]; then
            # A rehearsal may run from a branch: it checks the version of the code.
            version="$lib"
          else
            echo "::error::Publishing by hand must run from a tag (Use workflow from: v<version>)"
            exit 1
          fi
          echo "version $version, mojay $lib, mojay-cli $cli, npm $npm"
          if [ "$lib" != "$version" ] || [ "$cli" != "$version" ] || [ "$npm" != "$version" ]; then
            echo "::error::The tag does not match the versions in Cargo.toml and package.json"
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: plan
        name: What this run publishes
        run: |
          case "$MODE" in
            tag | rehearsal) crates=true; npm=true ;;
            crates) crates=true; npm=false ;;
            npm) crates=false; npm=true ;;
          esac
          echo "mode $MODE: crates $crates, npm $npm"
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
          echo "npm=$npm" >> "$GITHUB_OUTPUT"

  crates:
    name: Publish to crates.io
    needs: check-version
    if: needs.check-version.outputs.crates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish mojay and mojay-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          if [ "$MODE" = "rehearsal" ]; then
            cargo publish --dry-run -p mojay -p mojay-cli
            exit 0
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" -A "mojay-release" "https://crates.io/api/v1/crates/mojay/$VERSION")
          if [ "$status" = "200" ]; then
            echo "mojay $VERSION is already on crates.io: skipping."
          else
            cargo publish -p mojay -p mojay-cli
          fi

  node-binaries:
    name: Node.js binary (${{ matrix.target }})
    needs: check-version
    if: needs.check-version.outputs.npm == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            test: true
          # Cross-compiled on the arm64 runner: built, not tested.
          - os: macos-latest
            target: x86_64-apple-darwin
            test: false
          # The oldest supported Ubuntu sets the minimum glibc (2.35).
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            test: true
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            test: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json
      - run: npm ci
      - name: Build
        run: npx napi build --platform --release --target ${{ matrix.target }}
      - name: Test
        if: matrix.test
        run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: bindings/node/mojay.*.node
          if-no-files-found: error

  npm:
    name: Publish to npm
    needs: [check-version, node-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm accepts this run's OIDC identity instead of a
      # token (package settings → Trusted Publisher on npmjs.com), and links
      # the published version to it (provenance).
      id-token: write
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: bindings/node
          merge-multiple: true
      - name: Check the package
        run: |
          cp ../../LICENSE-MIT ../../LICENSE-APACHE .
          ls -l mojay.*.node
          count=$(ls mojay.*.node | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "::error::Expected 4 binaries, found $count"
            exit 1
          fi
          npm pack --dry-run
      - name: npm supports trusted publishing
        run: |
          # Trusted publishing needs npm 11.5.1 or later.
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))
            if (!ok) { console.error(`::error::npm ${process.argv[1]} is older than 11.5.1`); process.exit(1) }
          ' "$(npm --version)"
      - name: Publish
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          if [ "$MODE" = "rehearsal" ]; then
            npm publish --dry-run --access public
          elif npm view "$(jq -r .name package.json)@$VERSION" version >/dev/null 2>&1; then
            echo "$(jq -r .name package.json)@$VERSION is already on npm: skipping."
          else
            npm publish --provenance --access public
          fi

  github-release:
    name: GitHub release
    needs: [check-version, crates]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          # The section of this version: from its heading to the next one.
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists: skipping."
          else
            gh release create "$GITHUB_REF_NAME" --title "Mojay $VERSION" --notes-file notes.md
          fi
