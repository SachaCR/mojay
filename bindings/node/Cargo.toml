[package]
name = "mojay-node"
version = "0.1.2"
edition = "2024"
publish = false
license.workspace = true
description = "Node.js binding for Mojay"

[lib]
crate-type = ["cdylib"]

[dependencies]
mojay = { path = "../.." }
napi = { version = "3.16.2", default-features = false, features = ["napi6"] }
napi-derive = "3.7.1"

[build-dependencies]
napi-build = "2.6.0"
