[workspace]
members = [".", "cli", "demo/producer", "demo/consumer", "bindings/node", "bench"]

[workspace.package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/SachaCR/mojay"
homepage = "https://mojay.dev"
# Let chains and `slice::as_chunks`. Checked by the CI.
rust-version = "1.88"

[package]
name = "mojay"
version = "0.1.1"
edition = "2024"
description = "Topics, partitions, offsets and consumer groups in a local folder, with no server: SQLite for Kafka"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/mojay"
readme = "README.md"
keywords = ["kafka", "log", "queue", "embedded", "streaming"]
categories = ["database-implementations", "data-structures"]
# The library only: the other folders are separate crates, projects or docs.
include = ["/src", "/tests", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/Cargo.toml"]

[dependencies]
crc32c = "0.6.9"
memmap2 = "0.9.12"
rustix = { version = "1.1.6", features = ["fs"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
