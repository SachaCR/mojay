<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 406 197" role="img" aria-label="Mojay">
  <!-- A bird in flight. The wing is made of log segments that sweep into the
       body; every slanted edge shares the same angle. -->
  <defs>
    <linearGradient id="mojay-gradient" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="330" y2="230">
      <stop offset="0" stop-color="#ff8a1f"/>
      <stop offset="0.42" stop-color="#ff3d77"/>
      <stop offset="0.72" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <g fill="url(#mojay-gradient)">
    <!-- Upper wing: two segments joined by the leading edge -->
    <path d="M0 0 L23 32 Q31.7 44 46 44 L207 44 L219 61 L52 61 L75 92 Q83 104 97 104 L249 104 L285 155 L314 122 L246 26 Q227 0 197 0 Z"/>
    <!-- Lower wing: the last segment, ending in the tail -->
    <path d="M99 121 L120 150 Q129 163 143 163 L225 163 L250 193 L273 168 L246 129 Q240 121 231 121 Z"/>
    <!-- Head -->
    <path d="M295 65 L325 108 C345 88 375 64 402 58 L361 43 C340 38 312 42 296 50 L299 58 Z"/>
  </g>
</svg>
