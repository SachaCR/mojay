<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Mojay">
  <!-- Three log segments: two sealed, the active one still growing, with the
       next record about to be appended. -->
  <defs>
    <linearGradient id="mojay-gradient" gradientUnits="userSpaceOnUse" x1="4" y1="6" x2="60" y2="58">
      <stop offset="0" stop-color="#ff8a1f"/>
      <stop offset="0.55" stop-color="#ff3d77"/>
      <stop offset="1" stop-color="#9b2cf0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="6" width="56" height="14" rx="7" fill="url(#mojay-gradient)"/>
  <rect x="4" y="25" width="56" height="14" rx="7" fill="url(#mojay-gradient)"/>
  <rect x="4" y="44" width="34" height="14" rx="7" fill="url(#mojay-gradient)"/>
  <circle cx="51" cy="51" r="7" fill="url(#mojay-gradient)" opacity="0.55"/>
</svg>
